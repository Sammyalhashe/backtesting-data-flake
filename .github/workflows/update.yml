name: update-candles

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Append new candles
        if: github.event_name != 'push'
        run: python update.py

      - name: Commit new candles
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: append candles through $(date -u +%F)"
            git push
          fi

      - uses: cachix/install-nix-action@v27

      - uses: cachix/cachix-action@v15
        with:
          name: starllama
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build data package (pushed to cachix by cachix-action)
        run: nix build .#packages.x86_64-linux.default --print-build-logs
